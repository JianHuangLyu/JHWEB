<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f7fc">
    <title>圖片檢視｜呂建篁</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/portfolio.css?v=b836a55be1d1">
    <script src="js/scripts.js?v=4765e14b0744" defer></script>
    <script src="js/image-viewer.js?v=9336eaff604a" defer></script>
</head>
<body class="portfolio image-viewer-page">
    <header class="image-viewer-toolbar">
        <h1 id="viewer-title">圖片檢視</h1>
        <div class="image-viewer-controls" role="group" aria-label="圖片縮放">
            <button type="button" class="btn btn-header" id="viewer-zoom-out" aria-label="縮小" title="縮小（−）" disabled>−</button>
            <output id="viewer-zoom-level" aria-label="縮放比例" aria-live="off">—</output>
            <button type="button" class="btn btn-header" id="viewer-zoom-in" aria-label="放大" title="放大（+）" disabled>+</button>
            <button type="button" class="btn btn-header" id="viewer-fit" title="符合視窗（0）" disabled>符合視窗</button>
        </div>
        <a class="btn btn-header" href="index.html#projects">回到專案</a>
    </header>
    <main class="image-viewer-stage" tabindex="0" aria-label="圖片顯示區">
        <div class="image-viewer-content">
            <img id="viewer-image" alt="" draggable="false" hidden>
            <p id="viewer-message" role="status" hidden></p>
            <noscript>請啟用 JavaScript 查看圖片。</noscript>
        </div>
    </main>
</body>
</html>
