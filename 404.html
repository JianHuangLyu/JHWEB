<!doctype html>
<html lang="zh-Hant" data-view-theme="monochrome">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>找不到頁面｜呂建篁</title>
    <link rel="stylesheet" href="/JHWEB/css/styles.css">
    <link rel="stylesheet" href="/JHWEB/css/portfolio.css?v=2607e5e10ac8">
    <noscript><meta http-equiv="refresh" content="5; url=/JHWEB/"></noscript>
</head>
<body class="portfolio">
    <main id="layoutError" class="error-page portfolio-shell">
        <p class="error-code" aria-hidden="true">404</p>
        <h1>找不到這個頁面</h1>
        <p>你可以從首頁繼續瀏覽作品與履歷。</p>
        <p class="error-countdown"><span id="redirect-countdown">5</span> 秒後自動回到首頁。</p>
        <a class="btn btn-accent" id="redirect-home" href="/JHWEB/">回到首頁</a>
    </main>
    <script>
        (() => {
            const home = document.querySelector('#redirect-home').href;
            const countdown = document.querySelector('#redirect-countdown');
            let remaining = 5;
            const timer = setInterval(() => {
                remaining -= 1;
                countdown.textContent = remaining;
                if (remaining <= 0) {
                    clearInterval(timer);
                    location.replace(home);
                }
            }, 1000);
        })();
    </script>
</body>
</html>
